[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-agent-mandate"
version = "0.1.0"
description = "Agent LLM pilotant un drone simulé (ArduPilot SITL), attaques par injection de prompt et moniteur de mandat signé."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.40",   # protocole MAVLink
    "cryptography>=41",    # Ed25519 pour signer les mandats
    "pyyaml>=6",           # fichier de configuration
    "requests>=2.28",      # appels HTTP vers Ollama / API compatible OpenAI
    "matplotlib>=3.7",     # graphique des résultats
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["drone_agent_mandate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
